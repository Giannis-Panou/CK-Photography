<!DOCTYPE html>
<html lang="en" data-theme="noir" data-bs-theme="dark" data-type="bold" data-corners="square">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="CK Photography: city and landscape photography from Thessaloniki. Portfolio, projects and commissions."
		/>
		<meta name="theme-color" content="#0a0a0a" />
		<link rel="icon" type="image/png" href="/images/icons/favicon.png" />
		<title>CK Photography</title>
		<script>
			// Apply saved appearance settings before first paint to avoid a flash.
			(function () {
				var root = document.documentElement;
				var themes = { noir: 'dark', bone: 'light', gallery: 'light', darkroom: 'dark', film: 'light', nordic: 'light' };
				var read = function (key) {
					try {
						return localStorage.getItem(key);
					} catch (e) {
						return null;
					}
				};
				var theme = read('ck-theme');
				if (!themes[theme]) {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'noir'
						: 'bone';
				}
				var type = read('ck-type');
				var corners = read('ck-corners');
				root.dataset.theme = theme;
				root.dataset.bsTheme = themes[theme];
				root.dataset.type = /^(bold|classic|luxe|minimal)$/.test(type) ? type : 'bold';
				root.dataset.corners = corners === 'soft' ? 'soft' : 'square';
			})();
		</script>
	</head>
	<body class="hidden">
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
